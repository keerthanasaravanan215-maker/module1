<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simple HTML Page</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 3rem auto; padding: 1rem; }
        button { padding: .5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <p>This is a simple HTML page created for demonstration.</p>
    <button id="greet">Click me</button>

    <script>
        document.getElementById('greet').addEventListener('click', () => {
            alert('Hello from your simple page!');
        });
    </script>
</body>
</html>
